'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'Button'
description: 'A single button link.'
group: 'Seeds site'
status: stable
props:
  type: object
  required:
    - text
    - url
  properties:
    text:
      type: string
      title: 'Text'
      examples:
        - 'Learn more'
    url:
      type: string
      format: uri-reference
      title: 'Link'
      examples:
        - '/contact-us'
    style:
      type: string
      title: 'Style'
      enum:
        - primary
        - secondary
        - accent
        - ghost
      meta:enum:
        primary: 'Filled'
        secondary: 'Outline'
        accent: 'Accent colour'
        ghost: 'Text with arrow'
      examples:
        - primary
    size:
      type: string
      title: 'Size'
      enum:
        - default
        - large
      meta:enum:
        default: 'Default'
        large: 'Large'
      examples:
        - default
